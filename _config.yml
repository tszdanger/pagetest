# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Zongjie Li
subtitle: ''
description: 'Ph.D. Candidate, Computer Science'
keywords: Zongjie Li, LLM, Code, Security, HKUST, ETH Zurich
author: Zongjie Li
language: en
timezone: ''

# URL
url: https://tszdanger.github.io/pagetest/
root: /pagetest/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'img/**'

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: academic-pro

# Deployment
deploy:
  type: git
  repo: https://github.com/tszdanger/pagetest.git
  branch: gh-pages
